[package]
name = "ble-doctor"
version = "0.3.3"
edition = "2021"
description = "Cross-platform BLE diagnostics and security CLI"
repository = "https://github.com/doctor-labs/ble-doctor"
homepage = "https://github.com/doctor-labs/ble-doctor"
license = "MIT"
readme = "README.md"
keywords = ["bluetooth", "ble", "security", "diagnostics", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ble-doctor"
path = "src/main.rs"

[features]
test-support = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
doctor-core = "0.1"
doctor-kit = "0.2.2"
btleplug = "0.11"
futures = "0.3"
aes = "0.9.3"
# Already pulled in transitively by doctor-kit's own TUI; used directly here for the bare-scan
# live device-list screen (#113), kept at the exact version already resolved.
ratatui = "0.30.2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
libc = "0.2"
# Peripheral-mode GATT server for the #20 MITM clone (Linux/BlueZ only).
bluster = "0.1"
# bluster 0.1's public API (Service::new/Characteristic::new/...) takes
# uuid::Uuid 0.8 directly; promoted from transitive to direct since #63 calls
# that API itself (same version bluster already pins, so no extra resolution).
uuid = "0.8"
