[package]
name = "ble-doctor"
version = "0.1.0"
edition = "2021"
description = "Cross-platform BLE diagnostics and security CLI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ble-doctor"
path = "src/main.rs"

[features]
test-support = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
btleplug = "0.11"
